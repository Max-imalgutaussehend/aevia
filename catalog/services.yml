# Aevia service catalog (R2) — successor of ../services.yml.
# Derived from R1 at release-1 (phase 03). R1 file stays authoritative until cutover.
#
# Differences from R1:
#   - paperclip, openclaw dropped (agent stack removed, phase 04)
#   - networks: replaced by namespace + explicit `needs` (Cilium allow-list)
#   - new deployment fields: type, exposure, replicas, resources, persistence, auth
#
# FIELD REFERENCE
#   type        application | platform
#   exposure    public (reachable by anyone) | private (behind Authentik/Access)
#   port        container port; never published on the node
#   needs       dependencies this service may reach; everything else is denied
#   persistence PVC size, or none
#   hold        reason string: the generator emits NO manifests for this service
#   image       pinned image (tag or digest); required unless held
#   gate        access = tofu creates a Cloudflare Access app (operator emails) before the DNS record exists
#   service_account  name of a ServiceAccount (defined in gitops/base/platform) the pod runs as; its token is mounted
#   managed_by  helm = deployed from a chart in gitops/apps; generator emits nothing, tofu still publishes the host
#   scratch_paths  emptyDir mounts for directories the image expects to exist (e.g. ntfy cache)
#   add_caps    capabilities added back after drop ALL (root images only; keep minimal)
#   internet    true = may reach public internet on 80/443 (RFC1918 excluded)
#   namespace   apps | platform (default: apps for application, platform for platform)
#   TODO values are placeholders to be sized in the phase that migrates the service.

defaults:
  replicas: 1
  resources: { cpu: 100m, memory: 128Mi }
  auth: none

services:
  - name: n8n
    internet: true # outbound HTTPS to the public internet only
    image: n8nio/n8n:2.32.6
    type: application
    description: "Workflow automation and integration engine"
    port: 5678
    exposure: private
    auth: authentik
    healthcheck: /healthz
    needs: [postgres, redis]
    persistence: 5Gi # TODO size
    resources: { cpu: 250m, memory: 768Mi } # R1 limit; NODE_OPTIONS heap is 640, so 512Mi OOM-kills (found by tests/smoke)
    uid: 1000
    data_path: /home/node/.n8n
    secret_env: n8n-env # N8N_ENCRYPTION_KEY, DB_POSTGRESDB_PASSWORD (SOPS, phase 10)
    env:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres.data.svc.cluster.local
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_HOST: n8n.maxrommel.de
      WEBHOOK_URL: https://n8n.maxrommel.de/
      N8N_EDITOR_BASE_URL: https://n8n.maxrommel.de/
      NODE_OPTIONS: --max-old-space-size=640
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.readWriteFile","n8n-nodes-base.executeCommand"]'

  - name: portfolio
    image: ghcr.io/max-imalgutaussehend/site-maxrommel@sha256:5138911b0528b71c03c2f023ef3d0999ba5d40ad8e6ad0680d5cd0f91afc59ce
    type: application
    description: "Static personal site on the bare domain"
    port: 8080
    exposure: public
    apex: true
    aliases: [www]
    needs: []
    persistence: none
    uid: 65532 # image sets USER 65532
    add_caps: [NET_BIND_SERVICE] # caddy binary carries cap_net_bind_service; exec fails without it under drop ALL
    scratch_paths: [/config, /data] # caddy writes autosave and state even with admin off

  - name: aevia
    image: ghcr.io/max-imalgutaussehend/site-aevia@sha256:8adbf15e7ded6fdaadd9cfbe37e6c4e95677c47723b33deec4bc65133db0d552
    type: application
    description: "Aevia website (repo site-aevia, same Caddy static image as the portfolio)"
    port: 8080
    exposure: public
    needs: []
    persistence: none
    uid: 65532
    add_caps: [NET_BIND_SERVICE]
    scratch_paths: [/config, /data]

  - name: mcp
    image: ghcr.io/max-imalgutaussehend/aevia-mcp@sha256:bee7916b497015b5a89ddd8cda7fac11be382717aef5955cdbfa1d0f2220f08e
    type: application
    description: "Aevia MCP server: platform, metrics, logs, vault (read and write), AI gateway and push (repo aevia-mcp); private, OAuth via Authentik"
    port: 8000
    exposure: private
    gate: access
    access_ip_bypass: ["160.79.104.0/21"] # Anthropic's outbound range (platform.claude.com/docs/en/api/ip-addresses): claude.ai connects from there; everyone else gets the login
    # every /mcp call additionally needs an Authentik OAuth token
    needs: []
    internet: true # Authentik introspection over its public hostname
    persistence: none
    uid: 10001
    service_account: aevia-mcp # read-only cluster access, see gitops/base/platform/aevia-mcp.yaml
    healthcheck: /healthz
    scratch_paths: [/data, /home/mcp] # vault clone and git's home
    secret_env:
      - mcp-obsidian-env # OIDC client secret (SOPS)
      - { name: aevia-mcp-ntfy, optional: true } # NTFY_USER / NTFY_PASSWORD of the write-only ntfy user (SOPS)
      - { name: aevia-mcp-gateway, optional: true } # GATEWAY_API_KEY = FreeLLMAPI unified key; created by hand, never committed
      - { name: mcp-vault-git, optional: true } # VAULT_GIT_URL with a Forgejo token that can write the vault (write:repository); created by hand, never committed
      - mcp-internal # INTERNAL_TOKEN: static bearer for in-cluster callers (Jarvis), refused when the request came through Cloudflare (SOPS)
    env: { PUBLIC_URL: "https://mcp.maxrommel.de", OIDC_CLIENT_ID: aevia-mcp, OIDC_ISSUER: "https://authentik.maxrommel.de/application/o/aevia-mcp/", EXCLUDE_DIRS: "Privat", HOME: /home/mcp } # Privat: not readable, but writable (WRITE_EXCLUDE_DIRS is empty)

  - name: jarvis
    image: ghcr.io/max-imalgutaussehend/jarvis-brain@sha256:6535df2ee0d3b061618d92700bf27130079c3e8ff21e0fadd5f945d5f8550f47
    type: application
    namespace: agents # Claude Code runs here with edit rights: same isolation as the Herdr workspace (gateway only, no databases)
    description: "Jarvis brain: UI, sessions and Claude Code for the voice assistant (repo jarvis, branch spike/deployment); the voice node runs on the laptop"
    port: 8787
    exposure: private
    gate: access # Cloudflare Access with Authentik; the brain verifies the Access JWT itself (JARVIS_CF_TEAM / JARVIS_CF_AUD)
    needs: [freellmapi, mcp, ntfy] # Claude Code talks to the AI gateway (Anthropic wire format) and to the Aevia MCP server; ntfy for "background task finished"
    internet: true # Access certificate download, git over HTTPS
    persistence: 10Gi
    data_path: /data
    uid: 1000 # the `node` user of the image
    resources: { cpu: 200m, memory: 768Mi }
    secret_env:
      - herdr-gateway # ANTHROPIC_AUTH_TOKEN = FreeLLMAPI unified key (same secret as the Herdr workspace, same namespace)
      - jarvis-mcp # AEVIA_MCP_TOKEN, the shared internal token of the MCP server (SOPS)
      - handover-api # HANDOVER_API_TOKEN for the handover API in the Herdr pod (SOPS)
      - { name: herdr-ntfy, optional: true } # NTFY_USER / NTFY_PASSWORD / NTFY_TOPIC: write-only ntfy user, shared with the Herdr runner (SOPS)
    env:
      ANTHROPIC_BASE_URL: "http://freellmapi.platform.svc.cluster.local:3001"
      AEVIA_MCP_URL: "http://mcp.apps.svc.cluster.local:8000/mcp"
      HANDOVER_API_URL: "http://herdr.agents.svc.cluster.local:8099"
      NTFY_URL: "http://ntfy.platform.svc.cluster.local:80"
      HOME: /data/home # Claude's session files must survive restarts for --resume
      JARVIS_PUBLIC_URL: "https://jarvis.maxrommel.de" # filled into the laptop setup script
      JARVIS_PORT: "8787" # explicit: Kubernetes injects JARVIS_PORT=tcp://... for the service named jarvis and would override the image default
      JARVIS_DATA: /data/jarvis
      JARVIS_CWD: /data/workspace
      JARVIS_PERMISSION_MODE: acceptEdits
      JARVIS_CF_TEAM: super-hat-3be8
      JARVIS_CF_AUD: "dd250583fa78b205802bc3e1aeaaf522d697bec71861dffc158915b5754ddb12" # audience tag of the Access application (public, not a secret)

  - name: longevity
    type: application
    description: "LONGEVITY — Health Score Platform (DHBW MVP)"
    port: 8082
    api_port: 3000
    exposure: public
    healthcheck: /api/healthz
    needs: [postgres]
    persistence: none
    hold: "DHBW exam submission under review; R1 stays untouched, no R2 manifests until released"

  - name: status
    internet: true # outbound HTTPS to the public internet only
    image: louislam/uptime-kuma:2.4.0
    type: platform
    description: "Uptime Kuma — service monitoring and alerting"
    port: 3001
    exposure: private
    auth: authentik
    needs: [ntfy, n8n, portfolio] # in-cluster monitors
    persistence: 1Gi # TODO size
    data_path: /app/data
    env: { TZ: Europe/Berlin, UPTIME_KUMA_PORT: "3001" }

  - name: ntfy
    internet: true # outbound HTTPS to the public internet only
    image: binwiederhier/ntfy:v2.26.3
    type: platform
    description: "Push notification relay for alerts"
    port: 80
    exposure: private # the R2 sketch said public; R1 is private — decide in phase 19
    needs: []
    persistence: 1Gi # TODO size

    add_caps: [NET_BIND_SERVICE] # root image, listens on :80
    scratch_paths: [/var/cache/ntfy] # undelivered-message cache; lost on reschedule, 12h retention only
    args: [serve]
    data_path: /var/lib/ntfy
    config_file: { configmap: ntfy-server, source: catalog/config/ntfy-server.yml, mount: /etc/ntfy/server.yml }

  - name: authentik
    type: platform
    description: "Identity provider gating private services"
    port: 9000
    exposure: public # login page must be reachable; it gates the others
    managed_by: helm
    needs: [postgres]
    persistence: none

  # Operator UIs: deployed by their own charts/manifests, published through the tunnel behind Cloudflare Access.
  - name: git
    type: platform
    description: "Forgejo git server (Obsidian vault first); web UI behind Access + Authentik, git over HTTPS with tokens"
    port: 3000
    exposure: private
    gate: access
    access_bypass: ["*.git/*"] # smart-HTTP git endpoints: Forgejo's own token auth, no browser login possible
    managed_by: helm
    needs: []
    persistence: none

  - name: argocd
    type: platform
    namespace: argocd
    description: "Argo CD (GitOps controller UI)"
    port: 8080
    exposure: private
    gate: access
    managed_by: helm
    needs: []
    persistence: none

  - name: grafana
    type: platform
    namespace: observability
    description: "Grafana dashboards over Prometheus and Loki"
    port: 3000
    exposure: private
    gate: access
    managed_by: helm
    needs: []
    persistence: none

  - name: prometheus
    type: platform
    namespace: observability
    description: "Prometheus query UI"
    port: 9090
    exposure: private
    gate: access
    managed_by: helm
    needs: []
    persistence: none

  - name: freellmapi
    type: platform
    description: "FreeLLMAPI dashboard (AI gateway); agents use the in-cluster Service"
    port: 3001
    exposure: private
    gate: access
    managed_by: helm
    needs: []
    persistence: none
