# Template only. Real values go in hermes-signal.enc.yaml (sops -e -i). The number is Max's own (E.164): Hermes is a linked device of that account.
apiVersion: v1
kind: Secret
metadata: { name: hermes-signal, namespace: agents }
type: Opaque
stringData:
  SIGNAL_HTTP_URL: "http://127.0.0.1:8080"
  SIGNAL_ACCOUNT: "+49CHANGE_ME"
  SIGNAL_ALLOWED_USERS: "+49CHANGE_ME" # only these senders may talk to Hermes (here: Note to Self)
  SIGNAL_HOME_CHANNEL: "+49CHANGE_ME" # default delivery target of cron jobs
