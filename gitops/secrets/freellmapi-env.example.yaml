# Template only. Real values go in freellmapi-env.enc.yaml (sops -e -i).
# ENCRYPTION_KEY must be the SAME value as in the .env of the instance whose keys you adopt,
# otherwise the stored provider keys cannot be decrypted. Format: 64 hex chars (32 bytes).
apiVersion: v1
kind: Secret
metadata: { name: freellmapi-env, namespace: platform }
type: Opaque
stringData:
  ENCRYPTION_KEY: CHANGE_ME
