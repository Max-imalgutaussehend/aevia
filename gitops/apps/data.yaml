apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  source:
    repoURL: https://github.com/Max-imalgutaussehend/aevia.git
    targetRevision: main
    path: gitops/base/data
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    automated:
      prune: false
      selfHeal: true
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jqPathExpressions:
    - .spec.volumeClaimTemplates[]?.apiVersion
    - .spec.volumeClaimTemplates[]?.kind
    - .spec.volumeClaimTemplates[]?.status
