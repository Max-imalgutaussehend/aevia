apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source:
    repoURL: https://github.com/Max-imalgutaussehend/life-server.git
    targetRevision: r2
    path: gitops/base/services
  destination: { server: https://kubernetes.default.svc }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
