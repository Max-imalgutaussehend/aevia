deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - { from: "2024-04-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
  limits_config: { retention_period: 168h }
singleBinary:
  replicas: 1
  persistence: { size: 10Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
# No Loki rules exist (no ConfigMap with the label loki_rule): the rules sidecar only watched and held 68 MiB (ADR 0042).
sidecar:
  rules:
    enabled: false
