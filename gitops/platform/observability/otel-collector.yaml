# OTLP in, logs to Loki (phase 25). No traces backend: Tempo was removed (ADR 0040). Apps need an explicit egress rule to send here.
fullnameOverride: otel
mode: deployment
image: { repository: otel/opentelemetry-collector-contrib }
command: { name: otelcol-contrib }
config:
  receivers:
    otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
  processors:
    memory_limiter: { check_interval: 5s, limit_mib: 200 }
    batch: {}
  exporters:
    otlphttp/loki: { endpoint: http://loki.observability.svc.cluster.local:3100/otlp }
  service:
    pipelines:
      traces: null
      logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
      metrics: null
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
