# Argo CD (ADR-0031). Installed once by hand/tofu; afterwards it manages itself via gitops/apps.
global:
  domain: argocd.example.com   # replaced in phase 11 (Cloudflare)
configs:
  params:
    server.insecure: true      # TLS terminates at Cloudflare; the Service is ClusterIP only
  cm:
    exec.enabled: "false"
    url: https://argocd.maxrommel.de
    # Authentik OIDC (ADR-0035). The client secret lives in Secret argocd-oidc (SOPS, label part-of=argocd).
    oidc.config: |
      name: Authentik
      issuer: https://authentik.maxrommel.de/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: [openid, profile, email, groups]
    users.anonymous.enabled: "false"
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    # Traefik is ClusterIP behind cloudflared, so Ingresses never get a load-balancer address.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      return hs
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, operator, role:admin
    scopes: "[groups]"
server:
  service:
    type: ClusterIP
dex:
  enabled: false
# No ApplicationSets and no notification subscriptions exist (ADR 0042): both controllers idled at about 45 MiB together.
applicationSet:
  replicas: 0 # this chart version has no enabled switch
notifications:
  enabled: false
controller:
  # Measured: with a soft limit just above the live heap the controller stays at 240 MiB instead of 409 MiB, without extra CPU.
  env:
    - { name: GOMEMLIMIT, value: 260MiB }

# --- ksops (ADR-0032): decrypt SOPS manifests inside repo-server ---------------------
# The age private key lives only in Secret `sops-age` (argocd ns), created by hand in
# phase 10 from a key generated for the cluster. It is never committed.
repoServer:
  env:
    - { name: XDG_CONFIG_HOME, value: /.config }
    - { name: SOPS_AGE_KEY_FILE, value: /.config/sops/age/keys.txt }
  volumes:
    - { name: custom-tools, emptyDir: {} }
    - { name: sops-age, secret: { secretName: sops-age } }
  volumeMounts:
    - { name: custom-tools, mountPath: /usr/local/bin/kustomize, subPath: kustomize }
    - { name: custom-tools, mountPath: /.config/kustomize/plugin/viaduct.ai/v1/ksops/ksops, subPath: ksops }
    - { name: sops-age, mountPath: /.config/sops/age }
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.3.3
      command: ["/bin/sh", "-c"]
      args:
        - echo "Installing KSOPS and kustomize"; mv ksops /custom-tools/; mv kustomize /custom-tools/
      volumeMounts: [{ mountPath: /custom-tools, name: custom-tools }]
