# Per-namespace ceilings: a runaway workload cannot starve the single node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: edge
spec:
  hard:
    requests.cpu: '1'
    limits.memory: 512Mi
    pods: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: edge
spec:
  limits:
  - type: Container
    default:
      memory: 256Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
---
