# S3-compatible object store (phase 15): backup target and app storage. Secret `minio-auth`
# holds MINIO_ROOT_USER, MINIO_ROOT_PASSWORD. Nothing may reach it until a consumer is named.
apiVersion: v1
kind: Service
metadata: { name: minio, labels: { app.kubernetes.io/name: minio } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: minio }
  ports: [{ name: s3, port: 9000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio, labels: { app.kubernetes.io/name: minio } }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: aevia } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          ports: [{ name: s3, containerPort: 9000 }]
          envFrom: [{ secretRef: { name: minio-auth } }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: s3 }, periodSeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
