# NATS with JetStream. No consumer exists yet, so no ingress is allowed (policies.yaml).
apiVersion: v1
kind: Service
metadata: { name: nats, labels: { app.kubernetes.io/name: nats } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: nats }
  ports: [{ name: client, port: 4222 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nats, labels: { app.kubernetes.io/name: nats } }
spec:
  serviceName: nats
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nats } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nats, app.kubernetes.io/part-of: aevia } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nats
          image: nats:2.10.25-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{ name: client, containerPort: 4222 }, { name: monitor, containerPort: 8222 }]
          readinessProbe: { httpGet: { path: /healthz, port: monitor }, periodSeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
