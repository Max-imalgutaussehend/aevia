# S3-compatible object store (phase 15): backup target and app storage. SeaweedFS, because the
# official MinIO images are no longer published. Auth is ONLY enforced with an identities file:
# Secret `s3-auth` key `s3.json` (see gitops/secrets). Env-var credentials do not enable auth.
apiVersion: v1
kind: Service
metadata: { name: s3, labels: { app.kubernetes.io/name: s3 } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: s3 }
  ports: [{ name: s3, port: 8333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: s3, labels: { app.kubernetes.io/name: s3 } }
spec:
  serviceName: s3
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: s3 } }
  template:
    metadata: { labels: { app.kubernetes.io/name: s3, app.kubernetes.io/part-of: aevia } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: [server, -s3, -s3.config=/etc/seaweedfs/s3.json, -dir=/data, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=1024]
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe: { tcpSocket: { port: s3 }, periodSeconds: 15, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: auth, mountPath: /etc/seaweedfs, readOnly: true }
      volumes: [{ name: auth, secret: { secretName: s3-auth } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
