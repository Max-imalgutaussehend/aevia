apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources: [postgres.yaml, redis.yaml, policies.yaml]
configMapGenerator:
  - name: postgres-config
    files: [config/postgresql.conf]
  - name: postgres-initdb
    files: [config/10-roles-and-databases.sh]
  - name: redis-config
    files: [config/redis.conf]
