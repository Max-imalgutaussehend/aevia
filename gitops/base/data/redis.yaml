# Redis 7, queue backend for n8n. Secret `redis-auth` holds REDIS_PASSWORD.
apiVersion: v1
kind: Service
metadata: { name: redis, labels: { app.kubernetes.io/name: redis } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, labels: { app.kubernetes.io/name: redis } }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: aevia } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4.6-alpine
          command: ["sh", "-c", 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"']
          ports: [{ name: redis, containerPort: 6379 }]
          envFrom: [{ secretRef: { name: redis-auth } }]
          readinessProbe:
            exec: { command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }
            periodSeconds: 15
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 320Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /usr/local/etc/redis, readOnly: true }
      volumes:
        - { name: config, configMap: { name: redis-config } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
