# Hermes Agent (Nous Research, MIT): the central, always-on "chief of staff" agent (ADR 0045, beta).
# Runs the gateway (cron scheduler + OpenAI-compatible API server for Jarvis) in namespace agents: default-deny, no databases, gateway/MCP/ntfy only.
# Model access is the Claude subscription via Hermes' own Anthropic OAuth (`hermes model` / `hermes auth add anthropic --type oauth`), done by hand once:
#   kubectl -n agents exec -it hermes-0 -- hermes model
# The login lives in the volume (/vol/h); no API key. A usage tracker next to it logs the session totals per source (cron, api_server, ...) over time.
# The s6-overlay of the image needs root, so the gateway is started directly (tini as init, Kubernetes restarts it).
apiVersion: v1
kind: ConfigMap
metadata: { name: hermes-seed, namespace: agents, labels: { app.kubernetes.io/name: hermes } }
data:
  # Seeded once (only if missing): Hermes may edit its own config afterwards; delete the file on the volume to re-seed.
  config.yaml: |
    model:
      provider: anthropic
      default: claude-sonnet-5-5
    terminal:
      backend: local
      cwd: /vol/h/workspace
    mcp_servers:
      aevia:
        url: "http://mcp.apps.svc.cluster.local:8000/mcp"
        headers:
          Authorization: "Bearer ${AEVIA_MCP_TOKEN}"
        tools:
          exclude: ["n8n_*"] # the workflow builder is for Claude Code, not for the chief of staff
      callme:
        url: "http://callme.apps.svc.cluster.local:3333/mcp"
        headers:
          Authorization: "Bearer ${CALLME_MCP_TOKEN}"
        timeout: 600 # initiate_call blocks for the whole phone call
  SOUL.md: |
    # Hermes, chief of staff of Max (Aevia)

    You are Max's central agent on the Aevia platform and run around the clock. Max studies (DHBW) and is often in lectures: be brief, plan ahead,
    ask only when a decision is really his. Answer in German unless asked otherwise.

    What you can reach: the Aevia MCP server (tools `aevia_*`, vault notes, cluster read access, metrics, logs, n8n workflows, push via ntfy)
    and the build harness on the server (skill `aevia-handover`). You cannot change the cluster yourself: anything that builds or changes code goes
    through a handover so a branch with a RESULT.md comes back for review. Never merge or deploy on your own.

    Rules: never write secrets into notes, branches or messages; the vault folder `Privat` is not yours to read. Every recurring job you create
    must be listed in a note (`write_note`, folder `Aevia/Hermes`) so Max can see and stop it. Keep scheduled jobs cheap: this runs on a Claude
    subscription that is shared with Max's own work.
  skill-aevia-handover.md: |
    ---
    name: aevia-handover
    description: Hand a coding or build task to the Aevia server agent (Herdr + Claude Code) and read the result. Use for anything that must be built, changed or checked in a repository.
    ---
    # Handover to the server agent

    The handover API runs next to the build harness. Env: `HANDOVER_API_URL`, `HANDOVER_API_TOKEN` (already set). Only repositories under
    `github.com/Max-imalgutaussehend` and `git.maxrommel.de/akadmin` are accepted.

    1. Write a self-contained note (the agent has no chat history): goal, context, files, constraints, how to verify, what is out of scope. No secrets.
    2. Start: `curl -sS -X POST "$HANDOVER_API_URL/start" -H "Authorization: Bearer $HANDOVER_API_TOKEN" -H 'Content-Type: application/json' -d '{"repo":"github.com/Max-imalgutaussehend/<name>","slug":"<lowercase-dashes>","note":"<HANDOVER.md text>"}'`
       (build the JSON with `jq -n --arg note "$NOTE" ...` so quoting is safe).
    3. Watch: `GET $HANDOVER_API_URL/status/<slug>`; list: `GET /list`; stop: `POST /stop/<slug>`.
    4. When done: `GET /result/<slug>` returns RESULT.md (status done|partial|blocked, decisions, what needs the laptop). Summarise it for Max and push a message
       (ntfy) with the slug; the work sits on the branch `handover/<slug>` for Max's review. Never claim it is merged or deployed.
  skill-dashboard.md: |
    ---
    name: dashboard
    description: Keep Max's personal dashboard (dashboard.maxrommel.de) up to date: todos, reminders, trackers, financials, a short daily briefing. Use for every scheduled refresh and whenever Max tells you something that belongs on it.
    ---
    # Dashboard

    The page renders a JSON state from a closed set of widgets; you only change data, never code or HTML. Env: `DASHBOARD_API_URL`, `DASHBOARD_API_TOKEN` (already set).
    Read the vocabulary first if unsure: `curl -sS $DASHBOARD_API_URL/api/schema -H "Authorization: Bearer $DASHBOARD_API_TOKEN"`.

    - Read: `GET /api/state`. Max ticks todos and reminders off on the page himself: `done: true` is his answer, respect it, never reopen an item.
    - Replace the whole page: `PUT /api/state` (a `422` lists what to fix). Change one widget: `PUT /api/widgets/<id>` with the full widget (new ids are appended; `?after=<id>` places them).
      Remove: `DELETE /api/widgets/<id>`. Title, subtitle, briefing only: `PATCH /api/meta`. Build JSON with `jq -n` so quoting is safe.
    - Types: callout, stat, todo, reminders, tracker, chart (line|bar), budget, accounts, progress, agenda, list, text. Group widgets with the same `section`. The array order is the page order.
    - The server keeps the last 50 versions, so a bad edit is recoverable, but do not rely on it.

    Rules
    1. `briefing` is two or three sentences in German: what matters today, what is open, nothing else. Put the one thing that needs a decision into a `callout` (tone `warn`/`urgent` only when it really is).
    2. Numbers come only from Max, his notes (vault, never `Privat`) or tools you can name. Never invent or extrapolate a value; say where it came from in the widget `note` (for example "laut Notiz Finanzen/November").
    3. Do not delete todos Max created. Add, update due dates, mark `done` only when he told you it is done. Move finished ones out after a week.
    4. Keep it calm: at most about 15 widgets, charts only with at least 5 points, no widget without data. If a source is missing, leave the widget out instead of showing zeros.
    5. A scheduled run that finds nothing new changes nothing (no write, no tokens spent on rewriting).
  skill-call-escalation.md: |
    ---
    name: call-escalation
    description: How and when to reach Max when he does not answer: Signal, then ntfy, then a phone call (tool `initiate_call` of the callme MCP server). Use whenever you wait for a decision that is time-critical.
    ---
    # Reaching Max

    Ladder, one step at a time, never skipping upward without waiting:
    0. Before any call run the tool `call_budget`: it shows the remaining Twilio credit, calls left today and minutes left. The credit is a free trial and must never run out unnoticed:
       below 5 USD tell Max once (ntfy), below 2 USD the tool refuses to call by itself, so fall back to ntfy and say so.
    1. Signal message (your normal channel). State the question so that a one-word answer works.
    2. No answer after 20 minutes: ntfy push with high priority (`ntfy_send` of the aevia MCP server), same question in one sentence.
    3. No answer after another 15 minutes AND the matter cannot wait until Max is reachable again AND a decision has a deadline within the next hours: call with `initiate_call`.
    Create the follow-up checks as one-shot jobs (`hermes cron`), and cancel them as soon as any answer arrives (on any channel).

    Do not call when
    - it is between 22:00 and 07:30 (Europe/Berlin), unless Max told you to call him for this exact thing,
    - Max is in a lecture or exam according to the calendar or the vault (he mutes on purpose),
    - the matter is informational, or you could decide it yourself within the rules in SOUL.md,
    - `initiate_call` answers with a limit (3 calls per 24 h, 5 minutes each, 30 minutes in total, credit floor): fall back to ntfy and say so in the dashboard callout.
    - the answer to a turn is `(Max hat nichts gesagt)` twice in a row: say goodbye with `end_call` and fall back to Signal.

    The line is a Twilio trial: Max hears a short trial announcement and has to press a key before you can speak, so only call when he can pick up. The call is cut after 5 minutes.
    While you think or use tools the line is silent: use `speak_to_user` ("Einen Moment.") before anything that takes longer than a few seconds.

    On the call: the first sentence says who you are and what it is about, in at most 15 seconds, in German. Ask one yes/no or either/or question at a time. Repeat the answer back,
    then `end_call` with a short goodbye. Never read secrets or long lists aloud. The tool blocks until Max has answered, so make the call the last step of a job.
    Afterwards: put the outcome into the dashboard (callout) and a line into your note in `Aevia/Hermes`.
  merge-config.py: |
    # Idempotent: adds the callme MCP server to config.yaml when it is missing (the seed config is only copied once, Hermes may have edited its own).
    import sys, yaml
    p = sys.argv[1]
    c = yaml.safe_load(open(p)) or {}
    s = c.setdefault('mcp_servers', {})
    if 'callme' not in s:
        s['callme'] = {'url': 'http://callme.apps.svc.cluster.local:3333/mcp', 'headers': {'Authorization': 'Bearer ${CALLME_MCP_TOKEN}'}, 'timeout': 600}
        yaml.safe_dump(c, open(p, 'w'), sort_keys=False, allow_unicode=True)
        print('callme MCP server added')
  usage-track.py: |
    # Subscription tracking. `hermes usage` has no endpoint for the OAuth token, so this reads Hermes' own session store (state.db, read-only) every
    # USAGE_INTERVAL seconds and appends one JSON line: totals per source (cron = scheduled jobs and heartbeats, api_server = Jarvis, oneshot, ...) for the
    # last 24 h and for all time. Differences between lines give consumption over time. File: $HERMES_HOME/usage/usage.jsonl
    import json, os, sqlite3, time
    home = os.environ.get("HERMES_HOME", "/vol/h")
    out = os.path.join(home, "usage"); os.makedirs(out, exist_ok=True)
    f = os.path.join(out, "usage.jsonl")
    Q = ("select source, count(*), sum(input_tokens), sum(output_tokens), sum(cache_read_tokens), sum(cache_write_tokens), "
         "sum(coalesce(actual_cost_usd, estimated_cost_usd, 0)), sum(tool_call_count) from sessions where started_at >= ? group by source")
    def totals(c, since):
        keys = ("sessions", "input", "output", "cache_read", "cache_write", "cost_usd", "tool_calls")
        return {r[0]: dict(zip(keys, [r[1], r[2] or 0, r[3] or 0, r[4] or 0, r[5] or 0, round(r[6] or 0, 4), r[7] or 0])) for r in c.execute(Q, (since,))}
    while True:
        line = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
        try:
            c = sqlite3.connect("file:" + os.path.join(home, "state.db") + "?mode=ro", uri=True, timeout=10)
            line["last_24h"] = totals(c, time.time() - 86400)
            line["all_time"] = totals(c, 0)
            c.close()
        except Exception as e:
            line["error"] = str(e)[:200]
        with open(f, "a") as fh:
            fh.write(json.dumps(line, separators=(",", ":")) + "\n")
        if os.path.getsize(f) > 5 * 1024 * 1024:
            os.replace(f, f + ".1")
        time.sleep(int(os.environ.get("USAGE_INTERVAL", "1800")))
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: hermes, namespace: agents, labels: { app.kubernetes.io/name: hermes, app.kubernetes.io/part-of: aevia } }
spec:
  serviceName: hermes
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: hermes } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hermes, app.kubernetes.io/part-of: aevia } }
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      priorityClassName: agents-low
      securityContext: { runAsNonRoot: true, runAsUser: 10000, runAsGroup: 10000, fsGroup: 10000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: seed
          image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # the volume root is owned by root and Hermes refuses a home it does not own: keep everything in /vol/h (created here as uid 10000).
              # Older layout (home = volume root): move it in once.
              if [ ! -d /vol/h ]; then
                mkdir /vol/h
                for f in /vol/* /vol/.[!.]*; do [ -e "$f" ] && [ "$f" != /vol/h ] && [ "$(basename "$f")" != lost+found ] && mv "$f" /vol/h/ || true; done
              fi
              mkdir -p /vol/h/workspace /vol/h/skills/aevia-handover /vol/h/skills/dashboard /vol/h/skills/call-escalation
              [ -f /vol/h/config.yaml ] || cp /seed/config.yaml /vol/h/config.yaml
              [ -f /vol/h/.seeded-soul ] || { cp /seed/SOUL.md /vol/h/SOUL.md; touch /vol/h/.seeded-soul; }
              [ -f /vol/h/skills/aevia-handover/SKILL.md ] || cp /seed/skill-aevia-handover.md /vol/h/skills/aevia-handover/SKILL.md
              [ -f /vol/h/skills/dashboard/SKILL.md ] || cp /seed/skill-dashboard.md /vol/h/skills/dashboard/SKILL.md
              [ -f /vol/h/skills/call-escalation/SKILL.md ] || cp /seed/skill-call-escalation.md /vol/h/skills/call-escalation/SKILL.md
              /opt/hermes/.venv/bin/python /seed/merge-config.py /vol/h/config.yaml || echo 'config merge skipped'
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /vol }, { name: seed, mountPath: /seed, readOnly: true }]
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: ["/opt/hermes/bin/hermes"] # directly as PID 1: behind tini the CLI re-enters the s6 entrypoint, which needs root
          args: ["gateway", "run"]
          env:
            - { name: HERMES_HOME, value: /vol/h }
            - { name: HERMES_WRITE_SAFE_ROOT, value: /vol/h }
            - { name: HOME, value: /vol/h }
            - { name: API_SERVER_ENABLED, value: "true" }
            - { name: API_SERVER_HOST, value: "0.0.0.0" }
            - { name: API_SERVER_PORT, value: "8642" }
            - { name: HANDOVER_API_URL, value: "http://herdr.agents.svc.cluster.local:8099" }
            - { name: NTFY_URL, value: "http://ntfy.platform.svc.cluster.local:80" }
            - { name: DASHBOARD_API_URL, value: "http://dashboard.apps.svc.cluster.local:8080" }
            - { name: TZ, value: Europe/Berlin }
          envFrom:
            - { secretRef: { name: hermes-api } } # API_SERVER_KEY (SOPS)
            - { secretRef: { name: jarvis-mcp } } # AEVIA_MCP_TOKEN: the MCP server's internal bearer (same secret Jarvis uses)
            - { secretRef: { name: handover-api } } # HANDOVER_API_TOKEN
            - { secretRef: { name: herdr-ntfy, optional: true } } # NTFY_USER / NTFY_PASSWORD / NTFY_TOPIC (write-only)
            - { secretRef: { name: hermes-dashboard, optional: true } } # DASHBOARD_API_TOKEN (SOPS), same value as dashboard-api in apps
            - { secretRef: { name: hermes-callme, optional: true } } # CALLME_MCP_TOKEN (SOPS), same value as callme-mcp in apps; not the Twilio credentials
            - { secretRef: { name: hermes-signal, optional: true } } # SIGNAL_HTTP_URL / SIGNAL_ACCOUNT / SIGNAL_ALLOWED_USERS / SIGNAL_HOME_CHANNEL (SOPS); switches the Signal channel on
          ports: [{ name: api, containerPort: 8642 }]
          readinessProbe: { tcpSocket: { port: api }, periodSeconds: 20, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1536Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /vol }, { name: tmp, mountPath: /tmp }]
        - name: signal
          # signal-cli (native build, community packaging) as a linked device of Max's Signal account; Hermes talks to its HTTP daemon on localhost.
          # Idle until the device is linked (kubectl exec -i hermes-0 -c signal -- signal-cli --config /vol/h/signal link -n HermesAgent), then the daemon starts by itself.
          image: registry.gitlab.com/packaging/signal-cli/signal-cli-native:v0-14-9-2@sha256:35dff55ddd6d7f1de970c47b5cf30662dc4066841517683917237e15c5a70102
          command: ["sh", "-c"]
          args:
            - |
              A=/vol/h/signal/data/accounts.json
              until [ -f "$A" ] && grep -q '"number"' "$A"; do sleep 10; done
              NUM=$(sed -n 's/.*"number" *: *"\([^"]*\)".*/\1/p' "$A" | head -1)
              exec signal-cli --config /vol/h/signal --account "$NUM" daemon --http 127.0.0.1:8080
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /vol }, { name: tmp, mountPath: /tmp }]
        - name: usage-track
          image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: ["/opt/hermes/.venv/bin/python", "/seed/usage-track.py"]
          env:
            - { name: USAGE_INTERVAL, value: "1800" }
            - { name: HERMES_HOME, value: /vol/h }
            - { name: HOME, value: /vol/h }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /vol }, { name: tmp, mountPath: /tmp }, { name: seed, mountPath: /seed, readOnly: true }]
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: seed, configMap: { name: hermes-seed, defaultMode: 0555 } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
# API server of the gateway: the way Jarvis (and nothing else) talks to Hermes.
apiVersion: v1
kind: Service
metadata: { name: hermes, namespace: agents, labels: { app.kubernetes.io/name: hermes, app.kubernetes.io/part-of: aevia } }
spec:
  selector: { app.kubernetes.io/name: hermes }
  ports: [{ name: api, port: 8642, targetPort: api }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: hermes-api-from-jarvis, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: jarvis } } }]
      ports: [{ port: 8642 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: jarvis-to-hermes, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: jarvis } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: hermes } } }]
      ports: [{ port: 8642 }]
---
# Hermes reaches: the Aevia MCP server, the handover API (Herdr pod), the dashboard API, the callme MCP endpoint, ntfy. DNS and public HTTPS (Anthropic, Telegram) come from agent-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: hermes-egress, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
      ports: [{ port: 8000 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: herdr } } }]
      ports: [{ port: 8099 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: dashboard } }
      ports: [{ port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: callme } }
      ports: [{ port: 3333 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
      ports: [{ port: 80 }]
---
# The handover API accepts Hermes (it already accepts Jarvis); the bearer token is still required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: handover-api-from-hermes, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: herdr } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: hermes } } }]
      ports: [{ port: 8099 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-from-hermes, namespace: apps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ntfy-from-hermes, namespace: platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
      ports: [{ port: 80 }]
---
# Hermes may write the dashboard and ask callme to phone Max (bearer tokens still required on both).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dashboard-from-hermes, namespace: apps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: dashboard } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: callme-from-hermes, namespace: apps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: callme } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: hermes } }
      ports: [{ port: 3333 }]
