# The Aevia MCP server (service `mcp`, namespace apps) looks at the platform. Everything it may touch is listed here:
# read-only Kubernetes access through its own service account, and a few network paths to Prometheus, Loki, the AI gateway and ntfy.
apiVersion: v1
kind: ServiceAccount
metadata: { name: aevia-mcp, namespace: apps }
---
# Read-only. No secrets, no configmaps, no exec, no verbs other than get/list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: aevia-mcp-read }
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events, services, endpoints, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: aevia-mcp-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aevia-mcp-read }
subjects: [{ kind: ServiceAccount, name: aevia-mcp, namespace: apps }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: mcp-to-kube-apiserver, namespace: apps }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-to-platform-services, namespace: apps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 9090 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports: [{ port: 3100 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app.kubernetes.io/name: freellmapi } }
      ports: [{ port: 3001 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
      ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-from-mcp, namespace: observability }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
      ports: [{ port: 9090 }, { port: 3100 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-and-ntfy-from-mcp, namespace: platform }
spec:
  podSelector:
    matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [freellmapi, ntfy] }]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
      ports: [{ port: 3001 }, { port: 80 }]
---
# Jarvis (agents namespace) calls the MCP server with the shared internal token; nothing else in agents may.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-from-jarvis, namespace: apps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mcp } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: jarvis } }
      ports: [{ port: 8000 }]
