# n8n workflows may push notifications to ntfy (write-only user `n8n` on topic `aevia`, credential "Aevia ntfy" in n8n); nothing else in apps may.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ntfy-from-n8n, namespace: platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apps } }
          podSelector: { matchLabels: { app.kubernetes.io/name: n8n } }
      ports: [{ port: 80 }]
