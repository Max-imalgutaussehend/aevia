# Authentik as the single login for the operator tools (ADR-0035). Applied by the worker from the mounted ConfigMap.
# Client secrets come from the environment (Secret authentik-env, SOPS) via !Env, never from this file.
apiVersion: v1
kind: ConfigMap
metadata: { name: authentik-aevia-blueprint, namespace: platform }
data:
  aevia-sso.yaml: |
    version: 1
    metadata:
      name: Aevia SSO
    entries:
      - model: authentik_core.group
        id: grp-operator
        identifiers: { name: operator }
        attrs: { is_superuser: false }
      # The bootstrap admin is the operator account (single-user platform): real email for the OIDC email claim.
      - model: authentik_core.user
        identifiers: { username: akadmin }
        attrs:
          name: Max
          email: max.rml@web.de
          groups: [!KeyOf grp-operator]
      - model: authentik_providers_oauth2.scopemapping
        id: scope-groups
        identifiers: { name: Aevia groups }
        attrs:
          scope_name: groups
          expression: |
            return {"groups": [g.name for g in request.user.ak_groups.all()]}
      # --- Cloudflare Access (identity provider for every gated host) ---
      - model: authentik_providers_oauth2.oauth2provider
        id: prov-cloudflare
        identifiers: { name: Cloudflare Access }
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types: [authorization_code, refresh_token] # empty by default in this version: every authorize call fails
          client_id: cloudflare-access
          client_secret: !Env OIDC_CLOUDFLARE_SECRET
          redirect_uris:
            - { matching_mode: strict, url: "https://super-hat-3be8.cloudflareaccess.com/cdn-cgi/access/callback" }
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app-cloudflare
        identifiers: { slug: cloudflare-access }
        attrs: { name: Cloudflare Access, provider: !KeyOf prov-cloudflare, meta_launch_url: "https://argocd.maxrommel.de" }
      # --- Grafana ---
      - model: authentik_providers_oauth2.oauth2provider
        id: prov-grafana
        identifiers: { name: Grafana }
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types: [authorization_code, refresh_token] # empty by default in this version: every authorize call fails
          client_id: grafana
          client_secret: !Env OIDC_GRAFANA_SECRET
          redirect_uris:
            - { matching_mode: strict, url: "https://grafana.maxrommel.de/login/generic_oauth" }
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf scope-groups
      - model: authentik_core.application
        id: app-grafana
        identifiers: { slug: grafana }
        attrs: { name: Grafana, provider: !KeyOf prov-grafana, meta_launch_url: "https://grafana.maxrommel.de" }
      # --- Argo CD ---
      - model: authentik_providers_oauth2.oauth2provider
        id: prov-argocd
        identifiers: { name: Argo CD }
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types: [authorization_code, refresh_token] # empty by default in this version: every authorize call fails
          client_id: argocd
          client_secret: !Env OIDC_ARGOCD_SECRET
          redirect_uris:
            - { matching_mode: strict, url: "https://argocd.maxrommel.de/auth/callback" }
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf scope-groups
      - model: authentik_core.application
        id: app-argocd
        identifiers: { slug: argocd }
        attrs: { name: Argo CD, provider: !KeyOf prov-argocd, meta_launch_url: "https://argocd.maxrommel.de" }
      # Only members of `operator` may use these applications.
      - model: authentik_policies.policybinding
        identifiers: { target: !KeyOf app-cloudflare, group: !KeyOf grp-operator, order: 0 }
        attrs: { negate: false, enabled: true, timeout: 30 }
      - model: authentik_policies.policybinding
        identifiers: { target: !KeyOf app-grafana, group: !KeyOf grp-operator, order: 0 }
        attrs: { negate: false, enabled: true, timeout: 30 }
      - model: authentik_policies.policybinding
        identifiers: { target: !KeyOf app-argocd, group: !KeyOf grp-operator, order: 0 }
        attrs: { negate: false, enabled: true, timeout: 30 }
