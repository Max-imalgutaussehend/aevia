  server.yml: "# =============================================================================\n\
    # server.yml \u2014 ntfy, the alert relay (M8)\n# =============================================================================\n\
    #\n# WHAT NTFY IS FOR HERE\n#   Uptime Kuma detects that something is down; ntfy\
    \ is how that reaches your\n#   phone. Without it, monitoring only helps when\
    \ you are already looking at\n#   the dashboard \u2014 which is exactly when you\
    \ least need it.\n#\n# WHY SELF-HOSTED RATHER THAN ntfy.sh\n#   The public instance\
    \ works and is free, but alert contents would transit a\n#   third party, and\
    \ the topic name is the only secret. Self-hosted keeps\n#   operational detail\
    \ on infrastructure already trusted with the services it\n#   reports on.\n#\n\
    # THE ACCESS PROBLEM, STATED HONESTLY\n#   Every other service here is gated by\
    \ Cloudflare Access, which authenticates\n#   a BROWSER. The ntfy mobile app is\
    \ not a browser: it holds a long-lived\n#   subscription and cannot complete an\
    \ Access login flow. So either\n#     (a) the phone subscribes over a path Access\
    \ does not gate, or\n#     (b) auth happens inside ntfy itself, with tokens the\
    \ app can carry.\n#   This file takes (b): ntfy denies anonymous access, and the\
    \ phone uses an\n#   access token. See docs/milestones/M8.md for the token creation\
    \ step.\n# =============================================================================\n\
    \n# Public-facing URL. ntfy builds subscription URLs and links from this, so a\n\
    # wrong value produces notifications whose \"open\" action goes nowhere.\nbase-url:\
    \ \"https://ntfy.maxrommel.de\"\n\n# Bind inside the container only. No host port\
    \ is published; Caddy reaches this\n# over the apps network (ADR-0003, ADR-0004).\n\
    listen-http: \":80\"\n\n# --- Storage ----------------------------------------------------------------\n\
    # Messages are cached so a phone that was offline still receives them on\n# reconnect.\
    \ Without a cache file this is memory-only and a restart loses\n# anything undelivered.\n\
    cache-file: \"/var/cache/ntfy/cache.db\"\ncache-duration: \"12h\"\n\n# Attachment\
    \ support is deliberately not configured: alerts are text, and an\n# upload endpoint\
    \ is attack surface with no corresponding need.\n\nauth-file: \"/var/lib/ntfy/user.db\"\
    \n\n# --- THE LOAD-BEARING LINE --------------------------------------------------\n\
    # deny-all means an anonymous request can neither publish nor subscribe. The\n\
    # default is read-write for everyone, which on a reachable host means anyone\n\
    # can both read your alerts and forge them.\n#\n# Access is granted explicitly\
    \ per user/topic with `ntfy access`, which is a\n# one-time setup step documented\
    \ in M8.\nauth-default-access: \"deny-all\"\n\n# --- Behaviour --------------------------------------------------------------\n\
    # Keep the write path narrow: this instance exists to relay a handful of alerts\n\
    # from Uptime Kuma, not to serve arbitrary clients.\nenable-signup: false\nenable-login:\
    \ true\nweb-root: \"app\"\n\n# Upstream push relay. Required for iOS notifications\
    \ to arrive when the app is\n# backgrounded; harmless on Android. It forwards\
    \ only a message ID and topic,\n# not payload, so no alert content reaches the\
    \ relay.\nupstream-base-url: \"https://ntfy.sh\"\n\nbehind-proxy: true\n\nlog-level:\
    \ \"info\"\n"
