# Nightly logical dump of every database to a PVC, then pushed to the s3 store / B2 in phase 15/27.
# Secret `pg-backup-auth` holds PGUSER, PGPASSWORD. Restore: docs/runbooks/restore.md.
apiVersion: batch/v1
kind: CronJob
metadata: { name: pg-backup, namespace: data, labels: { app.kubernetes.io/name: pg-backup } }
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app.kubernetes.io/name: pg-backup, app.kubernetes.io/part-of: aevia } }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: dump
              image: postgres:17.7-alpine
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  f=/backup/aevia-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
                  pg_dumpall -h postgres.data.svc.cluster.local | gzip > "$f"
                  gzip -t "$f"
                  find /backup -name 'aevia-*.sql.gz' -mtime +14 -delete
                  ls -l "$f"
              envFrom: [{ secretRef: { name: pg-backup-auth } }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          volumes: [{ name: backup, persistentVolumeClaim: { claimName: pg-backup } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pg-backup, namespace: data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: pg-backup-egress, namespace: data }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pg-backup } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ port: 5432 }]
