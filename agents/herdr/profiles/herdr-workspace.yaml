# Herdr workspace (ADR-0036). One pod on the single node, low priority so it is the first to go under memory pressure.
# Persistent home, reached with
#   kubectl -n agents exec -it herdr-0 -- herdr
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: agents-low }
value: -100
preemptionPolicy: Never
globalDefault: false
description: Agent workloads yield to the platform when the single node is short of memory.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: herdr, namespace: agents, labels: { app.kubernetes.io/name: herdr, app.kubernetes.io/part-of: aevia } }
spec:
  serviceName: herdr
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: herdr } }
  template:
    metadata: { labels: { app.kubernetes.io/name: herdr, app.kubernetes.io/part-of: aevia } }
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      priorityClassName: agents-low
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: herdr
          image: ghcr.io/max-imalgutaussehend/aevia-herdr@sha256:0acc207e4d596e1478b3ccfcc22d5da0ddcbbc5e958950fd5cf62480a0f0dced
          env:
            # FreeLLMAPI speaks both wire formats: OpenAI at /v1, Anthropic Messages at /v1/messages (Claude Code appends the path).
            - { name: ANTHROPIC_BASE_URL, value: "http://freellmapi.platform.svc.cluster.local:3001" }
            - { name: OPENAI_BASE_URL, value: "http://freellmapi.platform.svc.cluster.local:3001/v1" }
            - { name: S3_ENDPOINT, value: "http://s3.data.svc.cluster.local:8333" }
            - { name: S3_BUCKET, value: agent-workspace }
            - { name: NTFY_URL, value: "http://ntfy.platform.svc.cluster.local:80" }
          envFrom:
            - { secretRef: { name: herdr-s3 } } # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of the `agents` S3 identity
            - { secretRef: { name: herdr-gateway, optional: true } } # ANTHROPIC_AUTH_TOKEN / OPENAI_API_KEY = FreeLLMAPI unified key (SOPS)
            - { secretRef: { name: handover-api, optional: true } } # HANDOVER_API_TOKEN: switches the handover API on (port 8099), shared with Jarvis (SOPS)
            - { secretRef: { name: herdr-ntfy, optional: true } } # NTFY_USER / NTFY_PASSWORD / NTFY_TOPIC: write-only user, "handover finished" pushes (SOPS)
          ports: [{ name: handover, containerPort: 8099 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: home, mountPath: /home/agent }
            - { name: tmp, mountPath: /tmp }
            - { name: git-credentials, mountPath: /etc/herdr-git, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        # lines "https://user:token@host" for the git hosts the agent may read and push (GitHub, git.maxrommel.de); created by hand, never committed
        - { name: git-credentials, secret: { secretName: herdr-git, optional: true } }
  volumeClaimTemplates:
    - metadata: { name: home }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
# Headless service of the StatefulSet; also the address of the handover API for Jarvis (http://herdr.agents.svc.cluster.local:8099).
apiVersion: v1
kind: Service
metadata: { name: herdr, namespace: agents, labels: { app.kubernetes.io/name: herdr, app.kubernetes.io/part-of: aevia } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: herdr }
  ports: [{ name: handover, port: 8099, targetPort: handover }]
---
# Only Jarvis may call the handover API (and it still needs the token); agents otherwise deny all ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: handover-api-from-jarvis, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: herdr } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: jarvis } } }]
      ports: [{ port: 8099 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: jarvis-to-handover-api, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: jarvis } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: herdr } } }]
      ports: [{ port: 8099 }]
---
# Agents may call the AI gateway and the agent-workspace bucket, nothing else inside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: herdr-gateway-and-s3, namespace: agents }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: herdr } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app.kubernetes.io/name: freellmapi } }
      ports: [{ port: 3001 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: s3 } }
      ports: [{ port: 8333 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
          podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
      ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ntfy-from-herdr, namespace: platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [herdr, jarvis] }] } # Jarvis pushes "background task finished"
      ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: s3-from-agents, namespace: data }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: s3 } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agents } }
          podSelector: { matchLabels: { app.kubernetes.io/name: herdr } }
      ports: [{ port: 8333 }]
